    <script>
      // Suppress benign iframe WebSocket HMR warnings from Vite dev client
      window.addEventListener('unhandledrejection', function(event) {
        var str = String(event.reason || '');
        if (str.includes('WebSocket') || (event.reason && String(event.reason.message || '').includes('WebSocket'))) {
          event.preventDefault();
        }
      });
    </script>
